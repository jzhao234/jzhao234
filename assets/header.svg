<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Junhao Zhao — outdoors, movement, travel, stargazing, stories, good meals, and a great nap">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F16"/>
      <stop offset="0.55" stop-color="#111926"/>
      <stop offset="1" stop-color="#16202F"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4D9CFF" stop-opacity="0.1"/>
      <stop offset="0.5" stop-color="#4D9CFF"/>
      <stop offset="1" stop-color="#7DB6FF" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#4D9CFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4D9CFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2B3B50" stroke-width="1"/>
    </pattern>
    <filter id="soft-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="260" rx="24" fill="url(#background)"/>
  <rect width="1200" height="260" rx="24" fill="url(#grid)" opacity="0.3"/>
  <circle cx="118" cy="130" r="150" fill="url(#glow)"/>
  <circle cx="1080" cy="130" r="170" fill="url(#glow)" opacity="0.45"/>

  <g>
    <rect x="54" y="66" width="128" height="128" rx="28" fill="#111926" stroke="#4D9CFF" stroke-width="2"/>
    <text x="118" y="147" text-anchor="middle" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="50" font-weight="700" fill="#E9EEF5">JZ</text>
    <circle cx="160" cy="88" r="5" fill="#4D9CFF" filter="url(#soft-glow)"/>
    <text x="118" y="218" text-anchor="middle" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="10" font-weight="600" letter-spacing="1.5" fill="#64748B">ALWAYS EXPLORING</text>

    <circle cx="250" cy="62" r="4" fill="#4D9CFF"/>
    <text x="266" y="67" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="12" font-weight="600" letter-spacing="2.5" fill="#64748B">OFF THE CLOCK</text>
    <rect x="250" y="82" width="470" height="2" rx="1" fill="url(#signal)"/>

    <text x="250" y="126" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#E9EEF5">Good trails, good meals,</text>
    <text x="250" y="163" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#E9EEF5">good stories, and a great nap.</text>
    <text x="250" y="198" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="11" font-weight="600" letter-spacing="1.7" fill="#4D9CFF">OUTDOORS · MOVEMENT · TRAVEL · STARGAZING · STORIES</text>

    <circle cx="1080" cy="56" r="17" fill="#4D9CFF" opacity="0.16"/>
    <circle cx="1080" cy="56" r="8" fill="#7DB6FF" filter="url(#soft-glow)"/>
    <path d="M930 52 L955 74 L980 47 L1018 45 L1038 69" fill="none" stroke="#2B3B50" stroke-width="1.5"/>
    <circle cx="930" cy="52" r="1.5" fill="#64748B"/>
    <circle cx="980" cy="47" r="1.8" fill="#94A5BA"/>
    <circle cx="1018" cy="45" r="2" fill="#94A5BA"/>
    <circle cx="1038" cy="69" r="1.5" fill="#64748B"/>
    <circle cx="1134" cy="88" r="2" fill="#64748B"/>
    <circle cx="955" cy="74" r="1.5" fill="#64748B"/>

    <path d="M744 218 L850 120 L902 171 L982 78 L1158 218 Z" fill="#111926" stroke="#2B3B50" stroke-width="2" stroke-linejoin="round"/>
    <path d="M850 120 L872 147 L888 139 L902 171" fill="none" stroke="#64748B" stroke-width="2" stroke-linejoin="round"/>
    <path d="M982 78 L1011 114 L1031 103 L1060 122" fill="none" stroke="#64748B" stroke-width="2" stroke-linejoin="round"/>
    <path d="M744 218 Q 840 184 912 205 T 1070 184 T 1158 204" fill="none" stroke="#4D9CFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <circle cx="912" cy="205" r="4" fill="#7DB6FF" filter="url(#soft-glow)"/>

    <g transform="translate(1030 174)" fill="none" stroke="#94A5BA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 35 24 0l24 35Z"/>
      <path d="M24 0v35M24 35l11-16"/>
    </g>
  </g>

  <rect width="1200" height="260" rx="24" fill="none" stroke="#1F2C3D" stroke-width="2"/>
</svg>
