<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Junhao Zhao — memory, routing, agents, and verification">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F16"/>
      <stop offset="0.55" stop-color="#111926"/>
      <stop offset="1" stop-color="#16202F"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4D9CFF" stop-opacity="0.1"/>
      <stop offset="0.5" stop-color="#4D9CFF"/>
      <stop offset="1" stop-color="#7DB6FF" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#4D9CFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4D9CFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2B3B50" stroke-width="1"/>
    </pattern>
    <filter id="soft-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="260" rx="24" fill="url(#background)"/>
  <rect width="1200" height="260" rx="24" fill="url(#grid)" opacity="0.3"/>
  <circle cx="118" cy="130" r="150" fill="url(#glow)"/>
  <circle cx="1080" cy="130" r="170" fill="url(#glow)" opacity="0.45"/>

  <g font-family="SFMono-Regular, Consolas, Liberation Mono, monospace">
    <rect x="54" y="66" width="128" height="128" rx="28" fill="#111926" stroke="#4D9CFF" stroke-width="2"/>
    <text x="118" y="147" text-anchor="middle" font-size="50" font-weight="700" fill="#E9EEF5">JZ</text>
    <circle cx="160" cy="88" r="5" fill="#4D9CFF" filter="url(#soft-glow)"/>

    <path d="M 220 130 H 1080" fill="none" stroke="url(#signal)" stroke-width="2"/>

    <g transform="translate(274 92)">
      <rect width="168" height="76" rx="12" fill="#111926" stroke="#2B3B50"/>
      <circle cx="22" cy="20" r="4" fill="#4D9CFF"/>
      <text x="84" y="47" text-anchor="middle" font-size="17" font-weight="600" letter-spacing="2" fill="#E9EEF5">MEMORY</text>
    </g>

    <g transform="translate(478 92)">
      <rect width="168" height="76" rx="12" fill="#111926" stroke="#2B3B50"/>
      <circle cx="22" cy="20" r="4" fill="#4D9CFF"/>
      <text x="84" y="47" text-anchor="middle" font-size="17" font-weight="600" letter-spacing="2" fill="#E9EEF5">ROUTING</text>
    </g>

    <g transform="translate(682 92)">
      <rect width="168" height="76" rx="12" fill="#111926" stroke="#2B3B50"/>
      <circle cx="22" cy="20" r="4" fill="#4D9CFF"/>
      <text x="84" y="47" text-anchor="middle" font-size="17" font-weight="600" letter-spacing="2" fill="#E9EEF5">AGENTS</text>
    </g>

    <g transform="translate(886 92)">
      <rect width="168" height="76" rx="12" fill="#111926" stroke="#2B3B50"/>
      <circle cx="22" cy="20" r="4" fill="#7DB6FF" filter="url(#soft-glow)"/>
      <text x="84" y="47" text-anchor="middle" font-size="17" font-weight="600" letter-spacing="2" fill="#E9EEF5">VERIFY</text>
    </g>

    <text x="274" y="206" font-size="12" letter-spacing="3" fill="#64748B">BUILDING SYSTEMS AROUND CLEAR BOUNDARIES</text>
  </g>

  <rect x="274" y="222" width="780" height="2" rx="1" fill="url(#signal)"/>
  <rect width="1200" height="260" rx="24" fill="none" stroke="#1F2C3D" stroke-width="2"/>
</svg>
